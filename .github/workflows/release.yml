name: Fork Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve image and version
        id: plan
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel="$version"
            release_tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            version="$(cat backend/cmd/server/VERSION)-fork.$(git rev-parse --short HEAD)"
            channel=main
            release_tag=main
            prerelease=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            echo "$image:$channel"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "$image:latest"; fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.plan.outputs.tags }}
          cache-from: type=gha,scope=fork-amd64
          cache-to: type=gha,mode=max,scope=fork-amd64
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        shell: bash
        run: |
          printf 'Source: `%s`\n\nImage: `%s@%s`\n\nProduction tracks `%s:main`.\n' "$GITHUB_SHA" "$IMAGE" "$DIGEST" "$IMAGE" > "$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_TAG" == main ]]; then
            git tag -f main "$GITHUB_SHA"
            git push origin refs/tags/main --force
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
